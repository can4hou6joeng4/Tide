name: Juejin Daily Automation

on:
  workflow_dispatch:
  schedule:
    # 09:14 Asia/Shanghai
    - cron: "14 1 * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: juejin-daily-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Juejin daily task
        env:
          JUEJIN_COOKIE: ${{ secrets.JUEJIN_COOKIE }}
          JUEJIN_USER_AGENT: ${{ vars.JUEJIN_USER_AGENT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ vars.TELEGRAM_MESSAGE_THREAD_ID }}
          JUEJIN_HEADLESS: "true"
        run: npm run checkin

      - name: Send fallback Telegram notification
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ vars.TELEGRAM_MESSAGE_THREAD_ID }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: npm run notify:fallback

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: juejin-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: debug/
          if-no-files-found: ignore
          retention-days: 7

      # 调用 enable 重置 GitHub 60 天不活跃自动停用 schedule 的计时器
      - name: Keep scheduled workflow alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/juejin-checkin.yml/enable
